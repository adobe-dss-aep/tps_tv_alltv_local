:root{color-scheme:light;--adobe-red:#EB1000;--adobe-black:#000;--adobe-white:#FFF;--font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--adobe-white);color:var(--adobe-black);font-family:var(--font-family);font-weight:400;line-height:1.5;letter-spacing:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

.wordmark{display:block;height:28px;width:auto;max-width:100%}
.team{margin:-16px 0 0;font-weight:700;font-size:1rem;letter-spacing:-.01em;color:#4B4B4B;text-align:center}
.art{display:block;width:100%;max-width:320px;height:auto}
.text{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.text p,.title{margin:0}
.title{font-weight:900;font-size:2.25rem;line-height:1;letter-spacing:-.02em}
.subtitle{font-size:1.0625rem;line-height:1.5}
@media(max-width:400px){.page{padding:16px}.card{padding:40px 24px}.title{font-size:2rem}}
</style>
